name: Validate source and documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/RhinoArcGIS.Core.Tests/RhinoArcGIS.Core.Tests.csproj -c Release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: node tools/verify-fixtures.mjs
      - run: node site/build.mjs
      - run: node --check site/build.mjs
      - run: node --check tools/verify-site-release.mjs
      - run: node --test tests/site-release.test.mjs
      - run: node --test tests/mcp/*.test.mjs
      - name: Check distribution boundary
        shell: bash
        run: |
          test -f LICENSE
          test -f ACKNOWLEDGEMENTS.md
          if git ls-files | grep -Ei '(^|/)(ArcGISPro[.]MCP|node_modules|bin|obj)/|[.](esriAddinX|dll|exe|pfx|pem)$'; then
            echo 'Unexpected runtime, private integration or credential file in source.'
            exit 1
          fi
# This job cannot certify the licensed ArcGIS Pro + embedded Rhino host. Run tools/e2e.ps1 locally.
