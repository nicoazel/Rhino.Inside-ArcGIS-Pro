name: Publish GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/PUBLISHING.md'
      - 'tests/data/**'
      - 'tools/generate-fixtures.py'
      - 'tools/verify-fixtures.mjs'
      - 'tools/verify-site-release.mjs'
      - 'tests/site-release.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Verify synthetic fixture provenance
        run: node tools/verify-fixtures.mjs
      - run: node site/build.mjs
      - name: Verify the complete pinned public release
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_REPOSITORY: ${{ github.repository }}
        run: node tools/verify-site-release.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
